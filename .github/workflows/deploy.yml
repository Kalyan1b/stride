name: Validate and deploy

on:
  push:
    branches: [dev, test, main]
  pull_request:
    branches: [dev, test, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promotion:
    name: Promotion order
    runs-on: ubuntu-latest
    steps:
      - name: Enforce dev to test to main
        env:
          EVENT_NAME: ${{ github.event_name }}
          TARGET_BRANCH: ${{ github.base_ref }}
          SOURCE_BRANCH: ${{ github.head_ref }}
          SOURCE_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
        run: |
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            exit 0
          fi
          case "$TARGET_BRANCH" in
            test) expected=dev ;;
            main) expected=test ;;
            *) exit 0 ;;
          esac
          if [[ "$SOURCE_BRANCH" != "$expected" || "$SOURCE_REPOSITORY" != "$GITHUB_REPOSITORY" ]]; then
            echo "::error::Promote $expected into $TARGET_BRANCH using a pull request from this repository."
            exit 1
          fi

  validate:
    name: Validate
    needs: promotion
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format:check
      - name: Test Stride
        run: npm test
      - name: Build and verify Stride
        run: npm run build:pages -- --preview
      - name: Save preview for manual testing
        uses: actions/upload-artifact@v7
        with:
          name: preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: preview-site
          if-no-files-found: error
          retention-days: 14
      - name: Package production site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9
        with:
          path: dist

  deploy:
    name: Deploy production
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d
      - name: Deploy verified production artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346
